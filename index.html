function clone(x){return JSON.parse(JSON.stringify(x))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function V(id){let e=document.getElementById(id);return e?e.value:''}function arr(v){return Array.isArray(v)?v:(String(v||'').split(/\n|\|/).map(x=>x.trim()).filter(Boolean))}function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}function safeSave(){try{state.meta=state.meta||{};state.meta.ultima_alteracao_local=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return mergeObj(clone(EMPTY),x||{})}catch(e){return clone(EMPTY)}}function fmtList(a){return arr(a).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">—</li>'}function tags(a,cls=''){return arr(a).map(x=>`<span class="tag ${cls}">${esc(x)}</span>`).join('')}function guide(obj,out){return `<details class="sectionGuide"><summary>Como usar esta etapa</summary><p><b>Objetivo:</b> ${obj}<br><b>Saída esperada:</b> ${out}</p></details>`}

function openModal(title,body,onSave){let box=document.getElementById('modalBox');box.innerHTML=`<h2>${esc(title)}</h2>${body}<div class="modalActions"><button class="btn" id="cancelM">Cancelar</button><button class="btn primary" id="saveM">Salvar</button></div>`;document.getElementById('modal').classList.add('open');document.getElementById('cancelM').onclick=closeModal;document.getElementById('saveM').onclick=()=>{onSave();safeSave();closeModal();render()};setTimeout(()=>autoSizeAll(box),10)}function closeModal(){document.getElementById('modal').classList.remove('open')}function inp(id,label,val='',wide=false,type='text'){return `<div class="${wide?'wide':''}"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`}function area(id,label,val='',wide=true){return `<div class="${wide?'wide':''}"><label>${label}</label><textarea id="${id}">${esc(Array.isArray(val)?val.join('\n'):val)}</textarea></div>`}function sel(id,label,val,opts,wide=false){return `<div class="${wide?'wide':''}"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function autoSizeAll(root=document){root.querySelectorAll('textarea').forEach(t=>{t.style.height='auto';t.style.height=Math.max(95,t.scrollHeight+2)+'px';t.oninput=()=>{t.style.height='auto';t.style.height=Math.max(95,t.scrollHeight+2)+'px'}})}

function vcNotes(items,kind){return arr(items).map(x=>`<div class="vcNote ${kind}">${esc(x)}</div>`).join('')||'<div class="small muted">—</div>'}
function cadeia(){let cols=state.cadeia_valor||[],w=190+Math.max(cols.length,1)*280;let rows=[['Pontos de decisão','decisoes','decision'],['Stakeholders / usuários envolvidos','atores','stake'],['Dores / desafios','dores','pain'],['Dores / desafios transversais','dores_transversais','cross'],['Fontes de dados e/ou pontos de contato','canais','data'],['Oportunidades de IA','oportunidades_ia','ai']];return `<div class="eyebrow">Mapear</div><h1 class="h1">Cadeia de Valor</h1><p class="lead">Mapa no formato do Mural IA: fases, processos-chave, decisões, stakeholders, dores, dados e oportunidades. Skills permanecem no menu Skills AS-IS.</p>${guide('Avançar fase por fase e visualizar as decisões e fricções que realmente movem o processo.','Cadeia de valor preenchida e editável, pronta para alimentar Carga Cognitiva e priorização.')}<div class="toolbar"><button class="btn primary" onclick="genericItem('cadeia_valor',null,'fase da cadeia',CV_FIELDS)">+ Adicionar fase</button><span class="small muted">Use Editar em cada fase para alterar os valores.</span></div><div class="vcWrap"><div class="vcBoard" style="grid-template-columns:190px repeat(${Math.max(cols.length,1)},minmax(280px,1fr));min-width:${w}px"><div class="vcCorner">Fases da cadeia de valor</div>${cols.map(x=>`<div class="phaseBlock"><div class="phaseMeta"><span class="tag pink">${esc(x.meta||'')}</span><span class="tag">Impacto ${x.impacto||'—'}/5</span></div><h3>${esc(x.nome)}</h3><div class="small muted">${esc(x.dono||'')}</div><div class="subPhases">${[0,1,2].map(i=>`<div class="subPhase">${esc(arr(x.processos)[i]||'—')}</div>`).join('')}</div><div class="vcEdit"><button class="btn" onclick="genericItem('cadeia_valor','${x.id}','fase da cadeia',CV_FIELDS)">Editar fase</button></div></div>`).join('')}${rows.map(([label,key,kind])=>`<div class="vcLabel">${label}</div>${cols.map(x=>`<div class="vcCell">${vcNotes(x[key],kind)}</div>`).join('')}`).join('')}</div></div>`}
const COG_FIELDS=[{key:'atividade',label:'Decisão / tarefa'},{key:'ator',label:'Responsável'},{key:'fase',label:'Fase'},{key:'impacto',label:'Impacto 1–5',number:true,inputType:'number'},{key:'nivel_cognitivo',label:'Nível cognitivo',type:'select',opts:['Conhecimento','Entendimento','Aplicação','Análise','Síntese / criação','Avaliação']},{key:'observacoes',label:'Observações',type:'area'},{key:'frequencia',label:'Frequência 1–5 · complementar',number:true,inputType:'number'},{key:'carga',label:'Carga 1–6 · complementar',number:true,inputType:'number'},{key:'potencial_ia',label:'Potencial / papel da IA',type:'area'}];
function carga(){return `<div class="eyebrow">Mapear</div><h1 class="h1">Carga Cognitiva</h1><p class="lead">Mesma leitura do Mural IA: impacto da decisão + nível de raciocínio exigido. Frequência/carga numérica continuam preservadas no JSON como informação complementar.</p>${guide('Avaliar decisões que exigem interpretação, síntese ou julgamento e cujo erro/melhoria tem impacto relevante.','Tabela simples para escolher onde IA pode apoiar raciocínio sem retirar responsabilidade humana.')}<div class="cogIntro"><div class="card"><h3>Como estimar</h3><ul class="list"><li>Quanta informação precisa ser processada para tomar a decisão?</li><li>A decisão depende de dados de múltiplas fontes?</li><li>Envolve interpretação, síntese, comparação ou julgamento?</li><li>Qual o impacto de melhorar — ou errar — essa decisão?</li></ul></div><div class="card"><h3>Escala sugerida</h3><p class="lead" style="margin:0">Impacto: <b>1 baixo → 5 alto</b>.<br>Nível cognitivo: Conhecimento → Entendimento → Aplicação → Análise → Síntese/criação → Avaliação.</p></div></div><div class="toolbar"><button class="btn primary" onclick="genericItem('carga_cognitiva',null,'item de carga cognitiva',COG_FIELDS)">+ Adicionar item</button></div><div class="cogTableWrap"><table class="cogTable"><thead><tr><th>Decisão / tarefa</th><th>Responsável</th><th>Impacto (1–5)</th><th>Nível cognitivo</th><th>Observações</th><th></th></tr></thead><tbody>${(state.carga_cognitiva||[]).map(x=>`<tr><td><b>${esc(x.atividade)}</b><div class="small muted">${esc(x.fase||'')}</div></td><td>${esc(x.ator||'')}</td><td><span class="cogImpact">${x.impacto||'—'}</span></td><td><span class="tag purple">${esc(x.nivel_cognitivo||'—')}</span></td><td>${esc(x.observacoes||x.potencial_ia||'')}</td><td><div class="itemActions"><button class="btn" onclick="genericItem('carga_cognitiva','${x.id}','item de carga cognitiva',COG_FIELDS)">Editar</button><button class="btn danger" onclick="delColl('carga_cognitiva','${x.id}')">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`}
const OPP_FIELDS=[{key:'nome',label:'Oportunidade / capability'},{key:'tipo',label:'Tipo'},{key:'problema',label:'Problema',type:'area'},{key:'solucao',label:'Hipótese de solução',type:'area'},{key:'impacto',label:'Impacto 1–5',number:true,inputType:'number'},{key:'complexidade',label:'Complexidade 1–5',number:true,inputType:'number'},{key:'confianca',label:'Confiança 1–5',number:true,inputType:'number'},{key:'status',label:'Status'},{key:'observacao',label:'Observação',type:'area'}];
function oportunidades(){return `<div class="eyebrow">Escolher</div><h1 class="h1">Oportunidades de IA</h1><p class="lead">Ideias/capabilities antes da decisão de prioridade. O ID é apenas técnico; P0/P1 não nasce aqui.</p>${guide('Transformar dores em hipóteses de melhoria, mantendo-as comparáveis e editáveis.','Conjunto de oportunidades pronto para priorização.') }<div class="toolbar"><button class="btn primary" onclick="genericItem('oportunidades',null,'oportunidade',OPP_FIELDS)">+ Adicionar oportunidade</button></div><div class="grid g3">${state.oportunidades.map(x=>`<div class="card opp itemCard"><div class="itemHead"><div><div class="eyebrow">${esc(x.id)}</div><h3>${esc(x.nome)}</h3></div><div class="itemActions"><button class="btn" onclick="genericItem('oportunidades','${x.id}','oportunidade',OPP_FIELDS)">Editar</button><button class="btn danger" onclick="delColl('oportunidades','${x.id}')">Excluir</button></div></div><div class="tags"><span class="tag">${esc(x.tipo)}</span><span class="tag purple">${esc(x.status)}</span></div><p class="small"><b>Problema:</b> ${esc(x.problema)}</p><p class="small"><b>Hipótese:</b> ${esc(x.solucao)}</p><div class="tags"><span class="tag pink">Impacto ${x.impacto}/5</span><span class="tag">Complexidade ${x.complexidade}/5</span><span class="tag green">Confiança ${x.confianca}/5</span></div></div>`).join('')}</div>`}
function priorityBucket(o){return Number(o.impacto)>=4?(Number(o.complexidade)>=4?'slice':'now'):(Number(o.complexidade)>=4?'later':'park')}
function priorityPreset(bucket){return {now:{impacto:5,complexidade:2,status:'Testar agora'},slice:{impacto:5,complexidade:4,status:'Fatiar e validar'},later:{impacto:2,complexidade:4,status:'Depois'},park:{impacto:2,complexidade:2,status:'Estacionada'}}[bucket]||{impacto:3,complexidade:3,status:'Em avaliação'}}
function priorityDragStart(ev,id){ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',id);document.body.classList.add('draggingPriority')}
function dragZoneOver(ev){ev.preventDefault();ev.currentTarget.classList.add('dropReady');if(ev.dataTransfer)ev.dataTransfer.dropEffect='move'}
function dragZoneLeave(ev){ev.currentTarget.classList.remove('dropReady')}
function priorityDrop(ev,bucket){ev.preventDefault();ev.currentTarget.classList.remove('dropReady');let id=ev.dataTransfer.getData('text/plain'),o=(state.oportunidades||[]).find(x=>String(x.id)===String(id));if(!o)return;let p=priorityPreset(bucket);o.impacto=p.impacto;o.complexidade=p.complexidade;o.status=p.status;let r=(state.priorizacao||[]).find(x=>String(x.oportunidade_id)===String(id));if(!r){r={id:uid('PR'),oportunidade_id:id,posicao:999,status:p.status,racional:'Movida visualmente na matriz de priorização.'};state.priorizacao.push(r)}else r.status=p.status;normalizePriorityRanking();safeSave();render()}
function normalizePriorityRanking(){let order={now:0,slice:1,later:2,park:3};let ops=state.oportunidades||[];let rows=state.priorizacao||[];rows.sort((a,b)=>{let oa=ops.find(x=>x.id===a.oportunidade_id),ob=ops.find(x=>x.id===b.oportunidade_id);if(!oa&&!ob)return 0;if(!oa)return 1;if(!ob)return-1;let ba=priorityBucket(oa),bb=priorityBucket(ob);if(order[ba]!==order[bb])return order[ba]-order[bb];let sa=Number(oa.impacto||0)*2+Number(oa.confianca||0)-Number(oa.complexidade||0),sb=Number(ob.impacto||0)*2+Number(ob.confianca||0)-Number(ob.complexidade||0);return sb-sa});rows.forEach((r,i)=>r.posicao=i+1)}
function priorityEdit(id){let x=state.priorizacao.find(x=>x.id===id);openModal('Editar priorização',`<div class="modalGrid">${inp('prPos','Posição',x.posicao,false,'number')}${inp('prStat','Status',x.status)}${area('prRat','Racional',x.racional)}</div>`,()=>{x.posicao=Number(document.getElementById('prPos').value||99);x.status=document.getElementById('prStat').value;x.racional=document.getElementById('prRat').value})}function priorityAdd(){let opts=state.oportunidades.filter(o=>!state.priorizacao.some(r=>r.oportunidade_id===o.id));if(!opts.length){alert('Todas as oportunidades já estão no ranking.');return}openModal('Adicionar ao ranking',`<div class="modalGrid"><div><label>Oportunidade</label><select id="paOpp">${opts.map(o=>`<option value="${esc(o.id)}">${esc(o.nome)}</option>`).join('')}</select></div>${inp('paPos','Posição',state.priorizacao.length+1,false,'number')}${inp('paStat','Status','Em avaliação')}${area('paRat','Racional','')}</div>`,()=>{state.priorizacao.push({id:uid('PR'),oportunidade_id:document.getElementById('paOpp').value,posicao:Number(document.getElementById('paPos').value||99),status:document.getElementById('paStat').value,racional:document.getElementById('paRat').value})})}
function priorizacao(){let xs=[...(state.priorizacao||[])].sort((a,b)=>a.posicao-b.posicao),ops=state.oportunidades||[];let defs=[['later','Depois','Baixo impacto · alta complexidade'],['slice','Fatiar e iterar','Alto impacto · alta complexidade'],['park','Estacionar','Baixo impacto · baixa complexidade'],['now','Começar / testar agora','Alto impacto · baixa ou média complexidade']];return `<div class="eyebrow">Escolher</div><h1 class="h1">Priorização</h1><p class="lead">Arraste as oportunidades entre os quatro quadrantes. Impacto, complexidade, status e posição do ranking são atualizados automaticamente conforme o destino.</p>${guide('Mover visualmente as oportunidades para comparar impacto × complexidade; os dados são recalculados pelo quadrante.','Matriz viva + ranking sincronizado.')}<div class="toolbar"><button class="btn primary" onclick="priorityAdd()">+ Adicionar ao ranking</button></div><div class="callout yellow"><b>Como funciona:</b> arrastar para <b>Começar</b> define alto impacto/menor complexidade; <b>Fatiar</b> alto impacto/alta complexidade; <b>Depois</b> baixo impacto/alta complexidade; <b>Estacionar</b> baixo impacto/baixa complexidade. Você ainda pode editar manualmente depois.</div><div class="dragHint">↕ Arraste qualquer oportunidade para outro quadrante.</div><div class="matrixWrap" style="margin-top:8px">${defs.map(([k,t,s])=>`<div class="matrixQuad ${k==='now'?'now':k==='slice'?'slice':''}" ondragover="dragZoneOver(event)" ondragleave="dragZoneLeave(event)" ondrop="priorityDrop(event,'${k}')"><h3>${t}</h3><div class="small muted">${s}</div><div style="margin-top:8px">${ops.filter(o=>priorityBucket(o)===k).map(o=>`<div class="vcNote priorityDrag ${k==='now'?'ai':k==='slice'?'decision':'data'}" draggable="true" ondragstart="priorityDragStart(event,'${o.id}')"><div class="dragHandle">⋮⋮ mover</div><b>${esc(o.nome)}</b><br><span class="small">Impacto ${o.impacto} · Complexidade ${o.complexidade} · Confiança ${o.confianca}</span></div>`).join('')||'<div class="small muted">Solte uma oportunidade aqui</div>'}</div></div>`).join('')}</div><h2 class="h1" style="font-size:23px;margin-top:18px">Ranking atual</h2><div class="grid g2">${xs.map(r=>{let o=ops.find(x=>x.id===r.oportunidade_id);if(!o)return'';return `<div class="card itemCard"><div class="rank"><div class="rankNum">${r.posicao}</div><div><h3>${esc(o.nome)}</h3><div class="tags"><span class="tag ${r.posicao===1?'pink':'purple'}">${esc(r.status)}</span><span class="tag">Impacto ${o.impacto}</span><span class="tag">Complexidade ${o.complexidade}</span><span class="tag green">Confiança ${o.confianca}</span></div></div><div class="itemActions"><button class="btn" onclick="priorityEdit('${r.id}')">Editar</button><button class="btn danger" onclick="delColl('priorizacao','${r.id}')">Excluir</button></div></div><p class="small" style="margin-top:9px">${esc(r.racional||o.observacao||'')}</p></div>`}).join('')}</div>`}
const CASE_FIELDS=[{key:'nome',label:'Nome do caso'},{key:'status',label:'Status'},{key:'problema',label:'Problema',type:'area'},{key:'usuarios',label:'Usuários · 1 por linha',type:'area',array:true},{key:'objetivo',label:'Objetivo',type:'area'},{key:'asis',label:'AS-IS',type:'area'},{key:'tobe',label:'TO-BE',type:'area'},{key:'inputs',label:'Inputs · 1 por linha',type:'area',array:true},{key:'outputs',label:'Outputs · 1 por linha',type:'area',array:true},{key:'outcomes',label:'Outcomes · 1 por linha',type:'area',array:true},{key:'metricas',label:'Métricas · 1 por linha',type:'area',array:true},{key:'observacoes',label:'Observações',type:'area'}];
function taskEdit(caseId,taskId){let c=state.casos_uso.find(x=>x.id===caseId);let t=taskId?c.tarefas_humano_ia.find(x=>x.id===taskId):{id:uid('T'),tarefa:'',modelo:'Copiloto',humano:'',ia:'',gate:''};openModal(taskId?'Editar tarefa Humano × IA':'Adicionar tarefa Humano × IA',`<div class="modalGrid">${inp('tTask','Tarefa',t.tarefa)}${sel('tMod','Modelo',t.modelo,['Humano','Embedding / Assistente','Copiloto','Agente','Agente com aprovação','Humano + apoio à decisão'])}${area('tHum','Papel humano',t.humano)}${area('tIa','Papel da IA',t.ia)}${area('tGate','Gate / limite',t.gate)}</div>`,()=>{Object.assign(t,{tarefa:V('tTask'),modelo:V('tMod'),humano:V('tHum'),ia:V('tIa'),gate:V('tGate')});if(!taskId){c.tarefas_humano_ia=c.tarefas_humano_ia||[];c.tarefas_humano_ia.push(t)}})}function delTask(caseId,taskId){let c=state.casos_uso.find(x=>x.id===caseId);c.tarefas_humano_ia=c.tarefas_humano_ia.filter(x=>x.id!==taskId);safeSave();render()}
function casos(){return `<div class="eyebrow">Desenhar</div><h1 class="h1">Casos de Uso</h1><p class="lead">Um ou vários casos podem coexistir. Cada caso leva consigo AS-IS → TO-BE, resultados e a divisão de trabalho Humano × IA por tarefa.</p>${guide('Detalhar apenas os casos que merecem discussão/experimento, sem transformar toda capability em “agente”.','Casos acionáveis, com interação Humano × IA explícita por tarefa.') }<div class="toolbar"><button class="btn primary" onclick="genericItem('casos_uso',null,'caso de uso',CASE_FIELDS)">+ Adicionar caso de uso</button></div><div class="grid g2">${state.casos_uso.map(c=>`<div class="card caseCard itemCard"><div class="itemHead"><div><div class="eyebrow">${esc(c.id)}</div><h3>${esc(c.nome)}</h3><span class="tag pink">${esc(c.status)}</span></div><div class="itemActions"><button class="btn" onclick="genericItem('casos_uso','${c.id}','caso de uso',CASE_FIELDS)">Editar caso</button><button class="btn danger" onclick="delColl('casos_uso','${c.id}')">Excluir</button></div></div><div class="caseSection"><b>Problema</b><div class="inputView">${esc(c.problema)}</div></div><div class="caseSection"><b>Objetivo</b><div class="inputView">${esc(c.objetivo)}</div></div><div class="grid g2 caseSection"><div><b class="small muted">AS-IS</b><div class="inputView">${esc(c.asis)}</div></div><div><b class="small muted">TO-BE</b><div class="inputView">${esc(c.tobe)}</div></div></div><div class="caseSection"><b>Usuários</b><div class="tags">${tags(c.usuarios)}</div></div><div class="grid g2 caseSection"><div><b class="small muted">Inputs</b><ul class="list">${fmtList(c.inputs)}</ul></div><div><b class="small muted">Outputs</b><ul class="list">${fmtList(c.outputs)}</ul></div></div><div class="caseSection"><b>Outcomes</b><ul class="list">${fmtList(c.outcomes)}</ul></div><div class="caseSection"><b>Métricas</b><ul class="list">${fmtList(c.metricas)}</ul></div><div class="caseSection"><div class="itemHead"><b style="font-size:11px;color:var(--ink)">Interação Humano × IA por tarefa</b><button class="btn" onclick="taskEdit('${c.id}')">+ Tarefa</button></div><div style="overflow:auto"><table class="taskTable"><thead><tr><th>Tarefa</th><th>Modelo</th><th>Humano</th><th>IA</th><th>Gate</th><th></th></tr></thead><tbody>${(c.tarefas_humano_ia||[]).map(t=>`<tr><td>${esc(t.tarefa)}</td><td><span class="tag purple">${esc(t.modelo)}</span></td><td>${esc(t.humano)}</td><td>${esc(t.ia)}</td><td>${esc(t.gate)}</td><td><button class="btn" onclick="taskEdit('${c.id}','${t.id}')">Editar</button><button class="btn danger" onclick="delTask('${c.id}','${t.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div></div><div class="callout" style="margin-top:10px">${esc(c.observacoes||'')}</div></div>`).join('')}</div>`}
const TOBE_FIELDS=[{key:'nome',label:'Capability futura'},{key:'dominio',label:'Domínio'},{key:'fases',label:'Fases / etapas · 1 por linha',type:'area',array:true},{key:'estado_futuro',label:'Estado futuro',type:'area'},{key:'skills_as_is_referencia',label:'Skills AS-IS de referência · IDs, 1 por linha',type:'area',array:true},{key:'logica_preservar',label:'Lógica / conhecimento a preservar · 1 por linha',type:'area',array:true},{key:'destino_as_is',label:'Destino do AS-IS',type:'area'},{key:'paridade_minima',label:'Paridade mínima esperada · 1 por linha',type:'area',array:true},{key:'melhorias',label:'Como o TO-BE melhora · 1 por linha',type:'area',array:true},{key:'novas_funcionalidades',label:'Novas funcionalidades · 1 por linha',type:'area',array:true},{key:'implementacao',label:'Princípio de implementação',type:'area'},{key:'dependencias',label:'Dependências',type:'area'},{key:'horizonte',label:'Horizonte'},{key:'status',label:'Status'}];
function tobe(){let migration=state.skills_as_is||[];return `<div class="eyebrow">Desenhar</div><h1 class="h1">TO-BE Completo</h1><p class="lead">Visão futura inteira, derivada do AS-IS. O objetivo é substituir a execução fragmentada atual por capabilities integradas, mantendo ou melhorando a função que já existe e adicionando o que hoje falta.</p>${guide('Derivar o TO-BE da cobertura funcional atual: preservar lógica útil, garantir paridade, melhorar a experiência e construir gaps reais.','Mapa completo de capabilities + plano de migração das 46 Skills AS-IS.') }<div class="callout pink"><b>Princípio:</b> Skills AS-IS são baseline funcional, não a arquitetura futura. Código, memória, contratos, governança e observabilidade devem convergir para a nova codebase Agentic Sales. Reusar lógica ≠ manter runtime separado.</div><div class="toolbar"><button class="btn primary" onclick="genericItem('tobe',null,'capability TO-BE',TOBE_FIELDS)">+ Adicionar capability</button></div><div class="tobeGrid">${state.tobe.map(x=>`<div class="card tobe itemCard"><div class="itemHead"><div><div class="eyebrow">${esc(x.dominio)}</div><h3>${esc(x.nome)}</h3></div><div class="itemActions"><button class="btn" onclick="genericItem('tobe','${x.id}','capability TO-BE',TOBE_FIELDS)">Editar</button><button class="btn danger" onclick="delColl('tobe','${x.id}')">Excluir</button></div></div><div class="tags" style="margin-bottom:7px">${arr(x.fases).map(f=>`<span class="tag green">${esc(f)}</span>`).join('')}</div><p class="small">${esc(x.estado_futuro)}</p><div class="tags">${arr(x.skills_as_is_referencia).slice(0,5).map(id=>`<span class="tag">${esc(state.skills_as_is.find(s=>s.id===id)?.nome||id)}</span>`).join('')}${arr(x.skills_as_is_referencia).length>5?`<span class="tag purple">+${arr(x.skills_as_is_referencia).length-5}</span>`:''}</div><div class="callout" style="margin-top:8px"><b>Destino do AS-IS:</b> ${esc(x.destino_as_is||'—')}</div><details style="margin-top:8px"><summary class="small"><b>Paridade · melhorias · novas funções</b></summary><div class="grid g2" style="margin-top:8px"><div><b class="small muted">Lógica a preservar</b><ul class="list">${fmtList(x.logica_preservar)}</ul></div><div><b class="small muted">Paridade mínima</b><ul class="list">${fmtList(x.paridade_minima)}</ul></div><div><b class="small muted">Como melhora</b><ul class="list">${fmtList(x.melhorias)}</ul></div><div><b class="small muted">O que passa a existir</b><ul class="list">${fmtList(x.novas_funcionalidades)}</ul></div></div><div class="callout yellow"><b>Implementação:</b> ${esc(x.implementacao||'—')}</div></details><div class="small muted" style="margin-top:8px"><b>Dependências:</b> ${esc(x.dependencias||'—')}</div><div class="tags" style="margin-top:7px"><span class="tag pink">${esc(x.horizonte)}</span><span class="tag purple">${esc(x.status)}</span></div></div>`).join('')}</div><h2 class="h1" style="font-size:22px;margin-top:22px">Migração AS-IS → TO-BE</h2><p class="lead">Checklist de cobertura: nenhuma função relevante do AS-IS deve desaparecer por acidente; a implementação atual pode ser descontinuada desde que a nova capability mantenha ou melhore o comportamento necessário.</p><div class="tablewrap migrationWrap"><table class="taskTable migrationTable"><thead><tr><th>Skill AS-IS</th><th>Fase atual</th><th>Decisão de migração</th><th>Capability TO-BE</th><th>Lógica a preservar</th></tr></thead><tbody>${migration.map(sk=>`<tr><td><b>${esc(sk.nome)}</b><div class="small muted">${esc(sk.id)}</div></td><td>${esc(sk.macro_fase||sk.estagio_catalogo||'—')}</td><td><span class="tag pink">${esc(sk.decisao_migracao||'A definir')}</span></td><td>${esc(sk.capability_tobe||sk.capability_tobe_id||'A definir')}</td><td>${esc(arr(sk.logica_preservar).join(' · ')||'—')}</td></tr>`).join('')}</tbody></table></div>`}

function prototipo(){let p=state.prototipo_3_semanas||EMPTY.prototipo_3_semanas;return `<div class="eyebrow">Executar</div><h1 class="h1">Protótipo · 3 semanas</h1><p class="lead">O que construir agora para aprender — e qual arquitetura mínima sustenta o experimento sem antecipar a plataforma inteira.</p>${guide('Tornar a candidata concreta em um fluxo testável antes/durante/depois e delimitar a menor arquitetura necessária.','Protótipo, arquitetura mínima, plano de testes e benchmark de mercado em uma tela.')}<div class="protoHero"><div class="itemHead"><div><span class="tag pink">${esc(p.status||'')}</span><h2>${esc(p.nome||'Defina o protótipo')}</h2><div class="small muted">${esc(p.subtitulo||'')}</div></div><button class="btn primary" onclick="protoCoreEdit()">Editar protótipo</button></div><p>${esc(p.objetivo||'')}</p><div class="callout" style="margin-top:10px"><b>Hipótese:</b> ${esc(p.hipotese||'—')}</div><div class="tags" style="margin-top:10px">${tags(p.usuarios,'purple')}</div><div class="callout yellow" style="margin-top:8px"><b>Implementação:</b> ${esc(p.principio_implementacao||'As skills AS-IS são referência funcional; o protótipo deve concentrar a execução em uma codebase integrada.')}</div></div><div class="protoMoments">${(p.momentos||[]).map(m=>`<div class="protoMoment itemCard"><div class="itemHead"><div><div class="eyebrow">${esc(m.momento)}</div><h3>${esc(m.objetivo)}</h3></div><div class="itemActions"><button class="btn" onclick="protoArrayEdit('momentos','${m.id}','momento',PROTO_MOMENT_FIELDS)">Editar</button><button class="btn danger" onclick="protoArrayDel('momentos','${m.id}')">Excluir</button></div></div><ul class="list">${fmtList(m.experiencia)}</ul><div class="callout"><b>Humano × IA:</b> ${esc(m.interacao)}</div></div>`).join('')}</div><div class="toolbar"><button class="btn" onclick="protoArrayEdit('momentos',null,'momento',PROTO_MOMENT_FIELDS)">+ Momento</button></div><div class="grid g2" style="margin-top:13px"><div class="card"><h3 ('')}</div><h2 class="h1" style="font-size:24px;margin-top:20px">Experimentos das 3 semanas</h2><div class="toolbar"><button class="btn primary" onclick="protoArrayEdit('experimentos',null,'experimento',PROTO_EXP_FIELDS)">+ Experimento</button></div><div class="protoTests">${(p.experimentos||[]).map(x=>`<div class="card itemCard"><div class="itemHead"><div><span class="tag">${esc(x.usuario)}</span><span class="tag purple">${esc(x.status)}</span><h3 style="margin-top:7px">${esc(x.cenario)}</h3></div><div class="itemActions"><button class="btn" onclick="protoArrayEdit('experimentos','${x.id}','experimento',PROTO_EXP_FIELDS)">Editar</button><button class="btn danger" onclick="protoArrayDel('experimentos','${x.id}')">Excluir</button></div></div><p><b>Testar:</b> ${esc(x.o_que_testar)}</p><div class="callout"><b>Sinal de sucesso:</b> ${esc(x.sinal_sucesso)}</div></div>`).join('')}</div><h2 class="h1" style="font-size:24px;margin-top:20px">Benchmark de mercado · inspiração, não requisito</h2><div class="toolbar"><button class="btn" onclick="protoArrayEdit('benchmarks_mercado',null,'benchmark',PROTO_BM_FIELDS)">+ Benchmark</button></div><div class="grid g3">${(p.benchmarks_mercado||[]).map(x=>`<div class="card benchmarkCard itemCard"><div class="itemHead"><h3>${esc(x.produto)}</h3><div class="itemActions"><button class="btn" onclick="protoArrayEdit('benchmarks_mercado','${x.id}','benchmark',PROTO_BM_FIELDS)">Editar</button><button class="btn danger" onclick="protoArrayDel('benchmarks_mercado','${x.id}')">Excluir</button></div></div><p class="small"><b>Padrão:</b> ${esc(x.padrao_observado)}</p><div class="callout"><b>Aprender:</b> ${esc(x.o_que_aprender)}</div><div class="callout yellow" style="margin-top:7px"><b>Não assumir:</b> ${esc(x.nao_assumir)}</div></div>`).join('')}</div>`}
function dateAdd(base,days){if(!base)return'';let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+Number(days||0));return d.toLocaleDateString('pt-BR')}function taskDate(t){let p=state.planejamento_333;let ini=dateAdd(p.data_inicio,t.offset_inicio),fim=dateAdd(p.data_inicio,Number(t.offset_inicio)+(Number(t.duracao_dias||1)-1));return ini+(fim&&fim!==ini?' → '+fim:'')}function planTaskEdit(id){let p=state.planejamento_333,x=id?p.atividades.find(x=>x.id===id):{id:uid('A'),horizonte:'3 dias',offset_inicio:0,duracao_dias:1,atividade:'',owner:'',status:'A fazer',concluido:false,saida:'',dependencias:[]};openModal(id?'Editar atividade 3-3-3':'Adicionar atividade 3-3-3',`<div class="modalGrid">${sel('aHor','Horizonte',x.horizonte,p.horizontes.map(h=>h.nome))}${inp('aOff','Offset em dias desde o início',x.offset_inicio,false,'number')}${inp('aDur','Duração em dias',x.duracao_dias,false,'number')}${inp('aOwn','Owner',x.owner)}${inp('aStat','Status',x.status)}${area('aAtv','Atividade',x.atividade)}${area('aOut','Saída esperada',x.saida)}${area('aDep','Dependências · 1 por linha',x.dependencias)}</div>`,()=>{Object.assign(x,{horizonte:V('aHor'),offset_inicio:Number(V('aOff')||0),duracao_dias:Number(V('aDur')||1),owner:V('aOwn'),status:V('aStat'),atividade:V('aAtv'),saida:V('aOut'),dependencias:arr(V('aDep'))});x.concluido=String(x.status).toLowerCase().includes('concl');if(!id)p.atividades.push(x)})}function toggleTask(id,ch){let x=state.planejamento_333.atividades.find(x=>x.id===id);x.concluido=ch;x.status=ch?'Concluído':'A fazer';safeSave();render()}const ROAD_FIELDS=[{key:'horizonte',label:'Horizonte / nome'},{key:'offset_inicio',label:'Início · dias após a data-base',number:true,inputType:'number'},{key:'offset_fim',label:'Fim · dias após a data-base',number:true,inputType:'number'},{key:'objetivo',label:'Objetivo',type:'area'},{key:'itens',label:'Itens / capabilities · 1 por linha',type:'area',array:true},{key:'status',label:'Status'}];
function roadmapOffsets(x,i=0){const defs={RM01:[0,2],RM02:[3,3],RM03:[3,23],RM04:[24,114],RM05:[115,198],RM06:[199,365]};let d=defs[x?.id]||[i?((state.planejamento_333?.roadmap?.[i-1]?.offset_fim??0)+1):0,i?((state.planejamento_333?.roadmap?.[i-1]?.offset_fim??0)+31):30];let s=(x?.offset_inicio!==undefined&&x?.offset_inicio!==null&&x?.offset_inicio!=='')?Number(x.offset_inicio):d[0];let e=(x?.offset_fim!==undefined&&x?.offset_fim!==null&&x?.offset_fim!=='')?Number(x.offset_fim):d[1];return [s,e]}
function roadDateRange(x,i=0){let p=state.planejamento_333,[s,e]=roadmapOffsets(x,i),ini=dateAdd(p.data_inicio,s),fim=dateAdd(p.data_inicio,e);return ini+(fim&&fim!==ini?' → '+fim:'')}
function roadLabel(x){const defs={RM01:'3 dias · Align',RM02:'Checkpoint',RM03:'3 semanas · Validar',RM04:'3 meses · MVP',RM05:'Expansão · Account / Pipeline / GTM',RM06:'Evolução TO-BE'};let h=String(x?.horizonte||'');return defs[x?.id]&&(/\d{1,2}\/\d{2}|202\d|dez|fev/i.test(h))?defs[x.id]:(h||defs[x?.id]||'Horizonte')}
function planejamento(){let p=state.planejamento_333,a=p.atividades||[],done=a.filter(x=>x.concluido).length,pct=a.length?Math.round(done/a.length*100):0;return `<div class="eyebrow">Executar</div><h1 class="h1">3-3-3 & Roadmap</h1><p class="lead">3-3-3 = plano imediato de aprendizagem/entrega. Roadmap = evolução da visão TO-BE inteira.</p>${guide('Converter a priorização em uma sequência ajustável de ações, checks e gates.','Cronograma vivo + progresso + roadmap de evolução.') }<div class="planTop"><b>Data de início</b><input type="date" value="${esc(p.data_inicio||'')}" onchange="state.planejamento_333.data_inicio=this.value;state.projeto.data_inicio_333=this.value;safeSave();render()"><span class="small muted">Alterar a data recalcula automaticamente o 3-3-3 e todas as datas do Roadmap TO-BE.</span><div class="progress"><span style="width:${pct}%"></span></div><b>${done}/${a.length} · ${pct}%</b><button class="btn primary" onclick="planTaskEdit()">+ Atividade</button></div><div class="lanes">${p.horizontes.map(h=>`<div class="lane"><div class="eyebrow">${esc(h.nome)}</div><h3>${esc(h.titulo)}</h3><div class="small muted">${dateAdd(p.data_inicio,h.offset_inicio)}${h.offset_fim!==h.offset_inicio?' → '+dateAdd(p.data_inicio,h.offset_fim):''}</div><div class="callout" style="margin:7px 0"><b>Gate:</b> ${esc(h.gate)}</div>${a.filter(x=>x.horizonte===h.nome).map(t=>`<div class="task ${t.concluido?'done':''}"><div class="taskTitle"><input type="checkbox" ${t.concluido?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><b>${esc(t.atividade)}</b></div><small>${taskDate(t)} · ${esc(t.owner||'Sem owner')} · ${esc(t.status)}</small><div class="itemActions" style="margin-top:6px"><button class="btn" onclick="planTaskEdit('${t.id}')">Editar</button><button class="btn danger" onclick="delPlanTask('${t.id}')">Excluir</button></div></div>`).join('')||'<div class="empty">Sem atividades.</div>'}</div>`).join('')}</div><h2 class="h1" style="font-size:21px;margin-top:19px">R ffset_inicio;if(!id)p.roadmap.push(x)})}function delRoad(id){state.planejamento_333.roadmap=state.planejamento_333.roadmap.filter(x=>x.id!==id);safeSave();render()}
const ST_FIELDS=[{key:'nome',label:'Stakeholder'},{key:'papel',label:'Papel'},{key:'tipo',label:'Tipo'},{key:'influencia',label:'Influência 1–5',number:true,inputType:'number'},{key:'interesse',label:'Interesse 1–5',number:true,inputType:'number'},{key:'necessidade',label:'Necessidade / interesse',type:'area'},{key:'contribuicao',label:'Contribuição esperada',type:'area'},{key:'ritmo',label:'Ritmo de envolvimento'},{key:'status',label:'Status'},{key:'observacao',label:'Observação',type:'area'}];const QA_FIELDS=[{key:'stakeholder',label:'Stakeholder / grupo'},{key:'fase',label:'Fase / etapa'},{key:'tema',label:'Tema'},{key:'pergunta',label:'Pergunta',type:'area'},{key:'resposta_atual',label:'Resposta atual',type:'area'},{key:'status',label:'Status',type:'select',opts:['Respondida','Respondida parcialmente','Em aberto','Revalidar']},{key:'contexto_resposta',label:'Contexto / quando foi respondida'},{key:'origem',label:'Origem / conversa'},{key:'ultima_validacao',label:'Última validação'},{key:'proxima_acao',label:'Próxima ação',type:'area'},{key:'evolucao',label:'O que mudou / evolução',type:'area'}];

function stakeholders(){let sts=state.stakeholders||[],qs=state.perguntas_stakeholders||[],sq=document.getElementById('qaStake')?.value||'',qf=document.getElementById('qaPhase')?.value||'',ss=document.getElementById('qaStatus')?.value||'';let fq=qs.filter(x=>(!sq||x.stakeholder===sq)&&(!qf||x.fase===qf)&&(!ss||x.status===ss));let quad=[['close','Gerenciar de perto','Alta influência · alto interesse',x=>Number(x.influencia)>=4&&Number(x.interesse)>=4],['satisfy','Manter satisfeito','Alta influência · menor interesse',x=>Number(x.influencia)>=4&&Number(x.interesse)<4],['inform','Manter informado','Menor influência · alto interesse',x=>Number(x.influencia)<4&&Number(x.interesse)>=4],['monitor','Monitorar','Menor influência · menor interesse',x=>Number(x.influencia)<4&&Number(x.interesse)<4]];return `<div class="eyebrow">Validar</div><h1 class="h1">Stakeholders & Perguntas</h1><p class="lead">Arraste stakeholders entre os quatro quadrantes. Influência e interesse se ajustam automaticamente de acordo com o quadrante; os detalhes continuam editáveis.</p>${guide('Mover stakeholders visualmente conforme influência × interesse e preservar o backlog de perguntas/respostas.','Mapa vivo de stakeholders + perguntas respondidas, parciais, abertas e a revalidar.') }<div class="toolbar"><button class="btn primary" onclick="genericItem('stakeholders',null,'stakeholder',ST_FIELDS)">+ Adicionar stakeholder</button><button class="btn pink" onclick="genericItem('perguntas_stakeholders',null,'pergunta',QA_FIELDS)">+ Adicionar pergunta</button></div><div class="callout"><b>Arrastar e soltar:</b> Gerenciar de perto = 5/5 · Manter satisfeito = 5/2 · Manter informado = 2/5 · Monitorar = 2/2. Depois do movimento, os campos de Influência e Interesse já ficam atualizados no JSON.</div><div class="dragHint">↕ Arraste o stakeholder pelo próprio chip.</div><div class="stakeMatrix">${quad.map(([key,name,sub,fn])=>`<div class="stakeQuad" ondragover="dragZoneOver(event)" ondragleave="dragZoneLeave(ev function liveSynthesisData(){let p=state.projeto||{},plan=state.planejamento_333||{},acts=plan.atividades||[],doneActs=acts.filter(x=>x.concluido),pendingActs=acts.filter(x=>!x.concluido).sort((a,b)=>Number(a.offset_inicio||0)-Number(b.offset_inicio||0)),pct=acts.length?Math.round(doneActs.length/acts.length*100):0,ranking=[...(state.priorizacao||[])].sort((a,b)=>Number(a.posicao||999)-Number(b.posicao||999)),top=ranking.slice(0,3).map(r=>({r,o:(state.oportunidades||[]).find(x=>x.id===r.oportunidade_id)})).filter(x=>x.o),leader=top[0],qs=state.perguntas_stakeholders||[],qCount={respondida:qs.filter(x=>x.status==='Respondida').length,parcial:qs.filter(x=>x.status==='Respondida parcialmente').length,aberta:qs.filter(x=>x.status==='Em aberto').length,revalidar:qs.filter(x=>x.status==='Revalidar').length},cases=state.casos_uso||[],tobes=state.tobe||[],roads=(plan.roadmap||[]).map((x,i)=>({x,i,range:roadDateRange(x,i)})),csd=state.csd||{certezas:[],suposicoes:[],duvidas:[]},base=plan.data_inicio||p.data_inicio_333||'',next=pendingActs.slice(0,6),last=state.meta?.ultima_alteracao_local||state.meta?.atualizado_em||'',msg=`${p.nome||'O projeto'} está em ${p.fase_atual||p.status||'evolução'}. ${leader?.o?.nome?`A oportunidade atualmente líder é “${leader.o.nome}” (${leader.r.status||'em avaliação'}). `:''}${base?`Com data-base em ${dateAdd(base,0)}, `:''}o 3-3-3 está em ${doneActs.length}/${acts.length} checks concluídos (${pct}%). O mural contém ${cases.length} casos de uso, ${tobes.length} capabilities TO-BE e ${qCount.aberta+qCount.revalidar} perguntas ainda abertas ou a revalidar.`;return {p,plan,acts,doneActs,pendingActs,pct,ranking,top,leader,qs,qCount,cases,tobes,roads,csd,base,next,last,msg}}

function sintese(){let d=liveSynthesisData(),manual=state.sintese||{},autoNext=d.next.map(t=>`${taskDate(t)} · ${t.atividade}${t.owner?' · '+t.owner:''}`),manualNext=arr(manual.proximos_passos),roadsHtml=d.roads.map(({x,i,range})=>`<li><b>${esc(roadLabel(x))}</b> · ${esc(range||'datas a definir')} · ${esc(x.status||'')}</li>`).join('')||'<li class="muted">Roadmap ainda não preenchido.</li>',topHtml=d.top.map(({r,o})=>`<li><b>#${esc(r.posicao)} · ${esc(o.nome)}</b> <span class="tag ${Number(r.posicao)===1?'pink':'purple'}">${esc(r.status||'')}</span></li>`).join('')||'<li class="muted">Priorização ainda não preenchida.</li>',caseActive=d.cases.filter(c=>/prior|prot[oó]tipo|mvp|candidat|teste|3 semanas/i.test(String(c.status||''))).slice(0,5),tobeNear=d.tobes.filter(t=>/3 semanas|agora|mvp|3 meses/i.test(String(t.horizonte||''))).slice(0,6);return `<div class="eyebrow">Validar · visão viva</div><h1 class="h1">Síntese</h1><p class="lead">Esta visão é recalculada automaticamente a partir do estado atual do mural. Alterar data, marcar checklist, mover prioridade, responder perguntas ou editar casos/TO-BE muda esta tela.</p><div class="toolbar"><button class="btn" onclick="editSummary()">Adicionar observação manual</button><span class="tag green">Atualização automática</span><span class="small muted">Última alteração salva: ${esc(fmtLastUpdate(d.last))}</span></div><div class="summaryHero"><b>Leitura executiva atual</b><br>${esc(d.msg)}</div><div class="metrics" style="margin-top:12px"><div class="metric"><b>${d.doneActs.length}/${d.acts.length}</b><span>checks 3-3-3 · ${d.pct}%</span></div><div class="metric"><b>${d.cases.length}</b><span>casos de uso</span></div><div class="metric"><b>${d.tobes.length}</b><span>capabilities TO-BE</span></div><div class="metric"><b>${d.qCount.aberta+d.qCount.revalidar}</b><span>perguntas abertas/revalidar</span></div><div class="metric"><b>${d.roads.length}</b><span>horizontes de roadmap</span></div></div><div class="grid g3" style="marg sd.certezas).length} certezas</span><span class="tag yellow">${arr(d.csd.suposicoes).length} suposições</span><span class="tag purple">${arr(d.csd.duvidas).length} dúvidas</span></div><p class="small muted" style="margin-top:9px">Esses totais também são derivados do conteúdo atual.</p></div></div>${manual.mensagem_executiva?`<div class="card" style="margin-top:12px"><div class="eyebrow">Observação executiva manual</div><div class="inputView">${esc(manual.mensagem_executiva)}</div></div>`:''}`}
function openImport(){openModal('Importar JSON',`<div class="modalGrid">${area('impJson','Cole o JSON aqui', '', true)}<div class="wide"><input type="file" id="impFile" accept="application/json,.json"></div></div>`,()=>{});document.getElementById('saveM').style.display='none';let actions=document.querySelector('.modalActions');actions.insertAdjacentHTML('beforeend','<button class="btn" id="mergeImp">Mesclar / acrescentar</button><button class="btn pink" id="replaceImp">Substituir projeto</button>');document.getElementById('impFile').onchange=async()=>{let f=document.getElementById('impFile').files[0];if(f)document.getElementById('impJson').value=await f.text()};document.getElementById('mergeImp').onclick=()=>applyImport('merge');document.getElementById('replaceImp').onclick=()=>applyImport('replace')}
function mergeObj(a,b){if(Array.isArray(a)&&Array.isArray(b)){let out=clone(a);b.forEach(x=>{if(x&&x.id){let i=out.findIndex(y=>y&&y.id===x.id);if(i>=0)out[i]=mergeObj(out[i],x);else out.push(clone(x))}else out.push(clone(x))});return out}if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){let o=clone(a);Object.keys(b).forEach(k=>o[k]=k in o?mergeObj(o[k],b[k]):clone(b[k]));return o}return clone(b)}function applyImport(mode){try{let incoming=JSON.parse(document.getElementById('impJson').value);state=mergeObj(clone(EMPTY),mode==='replace'?incoming:mergeObj(state,incoming));safeSave();closeModal();render()}catch(e){alert('JSON inválido: '+e.message)}}function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.projeto?.nome||'workspace').toLowerCase().replace(/[^a-z0-9]+/gi,'-')+'-v1.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function togglePresentation(){presentation=!presentation;document.body.classList.toggle('presentation',presentation)}function resetWorkspace(){if(confirm('Limpar todo o conteúdo deste navegador e voltar ao modelo vazio?')){state=clone(EMPTY);safeSave();active='central';render()}}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();setTimeout(()=>{if(active==='skills')renderSkillsList()},50);const oldRender=render;render=function(){oldRender();setTimeout(()=>{if(active==='skills')renderSkillsList();autoSizeAll()},0)};
</script></body></html>
